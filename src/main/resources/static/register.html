<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTIT Social Chat - Đăng Ký</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ptit-red: #e53935;
        }
        .bg-ptit-red {
            background: linear-gradient(135deg, #e53935 0%, #a31010 100%);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-xl">
        <div class="bg-white rounded-3xl shadow-2xl p-8 border-t-4 border-red-600">
            <div class="text-center mb-8">
                <div class="flex justify-center mb-4">
                    <div class="bg-red-600 text-white font-extrabold text-lg tracking-wider rounded-2xl w-14 h-14 flex items-center justify-center shadow-lg border border-red-500">
                        PTIT
                    </div>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Tạo tài khoản</h1>
                <p class="text-gray-500 mt-2 text-sm">Tham gia cộng đồng PTIT Social ngay hôm nay.</p>
            </div>

            <form id="registerForm" class="space-y-5">
                <!-- Row 1: Name and Email -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-500 font-bold mb-1.5 text-xs uppercase tracking-wider">HỌ VÀ TÊN</label>
                        <input type="text" id="fullName" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition text-sm" placeholder="Nguyễn Văn A" required>
                    </div>
                    <div>
                        <label class="block text-gray-500 font-bold mb-1.5 text-xs uppercase tracking-wider">EMAIL</label>
                        <input type="email" id="email" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition text-sm" placeholder="you@example.com" required>
                    </div>
                </div>

                <!-- PTIT Student Info Box (Optional) -->
                <div class="bg-rose-50/30 border border-red-100 rounded-2xl p-5 space-y-4">
                    <div class="flex items-center gap-2 text-red-600 font-bold text-sm">
                        <div class="w-7 h-7 bg-red-100 rounded-full flex items-center justify-center text-xs">
                            <i class="fas fa-graduation-cap"></i>
                        </div>
                        <span>Thông tin sinh viên PTIT <span class="text-xs text-gray-400 font-normal">(tùy chọn)</span></span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-500 font-semibold mb-1 text-xs">Mã sinh viên</label>
                            <input type="text" id="studentId" class="w-full bg-white px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:border-red-500 transition text-sm" placeholder="B21DCCN001">
                        </div>
                        <div>
                            <label class="block text-gray-500 font-semibold mb-1 text-xs">Khoa / Ngành</label>
                            <select id="major" class="w-full bg-white px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:border-red-500 transition text-sm text-gray-700">
                                <option value="">Chọn khoa...</option>
                                <option value="Công nghệ thông tin">Công nghệ thông tin</option>
                                <option value="An toàn thông tin">An toàn thông tin</option>
                                <option value="Khoa học máy tính">Khoa học máy tính</option>
                                <option value="Công nghệ đa phương tiện">Công nghệ đa phương tiện</option>
                                <option value="Kỹ thuật Điện tử viễn thông">Kỹ thuật Điện tử viễn thông</option>
                                <option value="Quản trị kinh doanh">Quản trị kinh doanh</option>
                                <option value="Thương mại điện tử">Thương mại điện tử</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Công nghệ tài chính">Công nghệ tài chính</option>
                                <option value="Kế toán">Kế toán</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Row 3: Password and Confirm -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-500 font-bold mb-1.5 text-xs uppercase tracking-wider">MẬT KHẨU</label>
                        <div class="relative">
                            <input type="password" id="password" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition text-sm" placeholder="••••••••" required>
                            <button type="button" onclick="togglePasswordVisibility('password')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                                <i class="far fa-eye-slash" id="toggle-icon-password"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-500 font-bold mb-1.5 text-xs uppercase tracking-wider">XÁC NHẬN MẬT KHẨU</label>
                        <div class="relative">
                            <input type="password" id="confirmPassword" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition text-sm" placeholder="••••••••" required>
                            <button type="button" onclick="togglePasswordVisibility('confirmPassword')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                                <i class="far fa-eye-slash" id="toggle-icon-confirmPassword"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-md mt-2">Đăng ký ngay</button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-500 text-sm">Đã có tài khoản? <a href="login.html" class="text-red-600 font-bold hover:underline">Đăng nhập tại đây</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        function togglePasswordVisibility(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById('toggle-icon-' + id);
            if (input && icon) {
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'far fa-eye';
                } else {
                    input.type = 'password';
                    icon.className = 'far fa-eye-slash';
                }
            }
        }
    </script>
</body>
</html>
